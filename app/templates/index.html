

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Generator</title>
  <style>
    /* Your existing CSS — unchanged */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: 
        linear-gradient(rgba(33, 147, 176, 0.6), rgba(109, 213, 237, 0.6)),
        url("https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1350&q=80");
        background-size: cover; 
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    

    .container {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 600px;
      width: 90%;
    }

    h1 {
      font-size: 3rem;
      color: #2b6cb0;
      margin-bottom: 20px;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    h1:hover {
      color: #63b3ed;
      transform: scale(1.1);
    }

    p {
      font-size: 1.3rem;
      color: #444;
      margin-bottom: 30px;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 80%;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background-color: #3182ce;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #2b6cb0;
    }

    @media screen and (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 2.2rem;
      }
      p {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome</h1>
    <p>Get inspired by random quotes!</p>
    <form id="nameForm" action="/set-name" method="post">
      <input type="text" name="name" id="nameInput" placeholder="Enter your name" required />
    </form>
    <button onclick="submitForm()">Get Started</button>
  </div>
  <script>
    function submitForm() {
      const nameInput = document.getElementById("nameInput").value.trim();
      if (nameInput !== "") {
        document.getElementById("nameForm").submit();
      } else {
        alert("Please enter your name first.");
      }
    }
  </script>
</body>
</html>
