<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Quote</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    h2 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    blockquote {
      font-size: 24px;
      font-style: italic;
      line-height: 1.6;
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-left: 6px solid #ffeb3b;
      border-radius: 8px;
      backdrop-filter: blur(5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    button, a#tweetLink {
      margin: 15px 10px;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: white;
    }

    button {
      background: linear-gradient(135deg, #ff6a00, #ee0979);
    }

    button:hover {
      background: linear-gradient(135deg, #ff8a00, #ff3c8f);
      transform: scale(1.05);
    }

    a#tweetLink {
      background: linear-gradient(135deg, #1da1f2, #0d8ddb);
    }

    a#tweetLink:hover {
      background: linear-gradient(135deg, #0b84d1, #1179d0);
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      blockquote {
        font-size: 20px;
        padding: 15px;
      }

      h2 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <h2>Your Personalized Quote:</h2>
  <blockquote>{{ quote }}</blockquote>

  <div>
    <button onclick="copyToClipboard()">Copy</button>
    <a id="tweetLink" target="_blank">Tweet This</a>
  </div>

  <script>
    const quote = "{{ quote }}";

    function copyToClipboard() {
      navigator.clipboard.writeText(quote);
      alert("Quote copied!");
    }

    document.getElementById("tweetLink").href =
      "https://twitter.com/intent/tweet?text=" + encodeURIComponent(quote);
  </script>
</body>
</html>
